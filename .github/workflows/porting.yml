name: Host porting tools

on:
  pull_request:
    branches: [main]
    paths: ['tools/**', 'tests/**', 'profiles/**', '.github/workflows/porting.yml']
  push:
    branches: [main]
    paths: ['tools/**', 'tests/**', 'profiles/**', '.github/workflows/porting.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Host regression tests (invented fixtures, no OEM inputs)
        run: python3 -m unittest discover -s tests -v
